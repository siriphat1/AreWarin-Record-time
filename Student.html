<!doctype html><html lang="th"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#153d30"><title>AreWarin · My Learning</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--forest:#143f31;--green:#23664e;--sage:#e6f0e9;--paper:#f7f8f5;--ink:#19342b;--muted:#71847a;--line:#e1e9e2;--orange:#aa7528;--blue:#3e719b;--danger:#af5656;--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 'DM Sans','Noto Sans Thai',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hide{display:none!important}.shell{min-height:100vh;display:flex}.sidebar{background:var(--forest);color:#f7f9f5;width:238px;padding:25px 17px;display:flex;flex-direction:column;gap:23px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#eaf2e9;color:var(--forest);display:grid;place-items:center;font-size:24px;font-weight:800}.brand strong{font-size:17px;display:block}.brand small{color:#c0d6c9;font-size:10px;letter-spacing:.12em}.nav{display:flex;flex-direction:column;gap:5px}.nav button{width:100%;background:transparent;color:#cfdfd5;border:0;text-align:left;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:11px;font-weight:600}.nav button.active,.nav button:hover{background:#ebf6ed;color:var(--forest)}.nav button span{font-size:19px;width:24px;text-align:center}.sidebarfoot{margin-top:auto;font-size:12px;color:#b7ccbf}.main{flex:1;min-width:0;max-width:1130px;padding:38px clamp(16px,4vw,50px) 90px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:29px}.kicker{text-transform:uppercase;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em}.title{font-size:clamp(25px,3vw,35px);font-weight:800;line-height:1.24;letter-spacing:-.035em;margin:6px 0 5px}.sub{color:var(--muted);margin:0}.idpill{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:8px 12px;background:#fff;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:23px;min-width:0}.card h3{font-size:16px;margin:0 0 12px}.summary{background:#edf5ef}.metric{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.3}.small{color:var(--muted);font-size:12px}.muted{color:var(--muted)}.line{border-top:1px solid var(--line);margin:13px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.tag{font-size:11px;font-weight:700;display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;background:var(--sage);color:var(--green)}.tag.warn{background:#fff2de;color:var(--orange)}.tag.info{background:#e9f1f9;color:var(--blue)}.tag.bad{background:#fcebea;color:var(--danger)}.progress{height:8px;background:#e4ebe5;border-radius:40px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:40px}.btn{border:1px solid #d3e2d7;background:#eef5ef;color:var(--forest);padding:10px 15px;border-radius:12px;font-weight:700;min-height:41px}.btn.primary{background:var(--forest);border-color:var(--forest);color:white}.btn.ghost{background:white}.btn.full{width:100%}.btn.danger{color:#a34c4c;background:#fff8f7;border-color:#f0d6d5}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.form{display:grid;gap:13px}.form label{display:grid;gap:5px;font-size:13px;font-weight:700}.form input,.form textarea,.form select{width:100%;background:#fff;color:var(--ink);border:1px solid #ceddd2;border-radius:11px;padding:11px 12px;min-height:43px;outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#2d7759;box-shadow:0 0 0 3px #26774f16}.form textarea{resize:vertical;min-height:94px}.notice{padding:12px 14px;background:#f1f7f2;border:1px solid #dce9dc;border-radius:13px;color:#436b54;font-size:13px}.warning{background:#fff8ec;border-color:#efdfc5;color:#8e6724}.error{background:#fff0ef;border-color:#efd1d0;color:#994a4a}.list-row{padding:13px 0;border-top:1px solid var(--line);display:flex;gap:11px;align-items:center;justify-content:space-between}.list-row:first-of-type{border-top:0}.datebadge{border-radius:12px;background:#eff4ef;min-width:49px;min-height:50px;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--green);font-weight:700}.datebadge strong{font-size:20px;line-height:1}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left;font-size:13px}th{background:#f2f6f2;color:#6f8476;font-size:11px;letter-spacing:.02em}th,td{padding:12px 14px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:25px 14px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 14px}.section-head h2{font-size:18px;margin:0}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{padding:8px 5px;border:1px solid var(--line);background:#fff;min-height:64px;border-radius:10px;text-align:left;align-content:start;position:relative}.day.sel{border-color:var(--green);background:var(--sage)}.day.other{opacity:.28}.day b{font-size:12px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--green);margin:4px 2px}.dot.group{background:#5189bd}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dcece0 0%,#f8f9f6 53%)}.auth{width:min(420px,100%);background:white;border:1px solid #e1e9e2;border-radius:24px;padding:30px;box-shadow:0 25px 85px #173b3020}.auth .brand{margin-bottom:25px}.auth h1{font-size:27px;line-height:1.2;margin:0 0 9px}.auth p{color:var(--muted)}.auth .form{margin-top:22px}.alert{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--forest);color:white;border-radius:12px;padding:11px 18px;box-shadow:0 10px 30px #15382a33;z-index:40;max-width:calc(100vw - 30px)}.modalback{position:fixed;inset:0;z-index:20;background:#102b2690;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:20px;width:min(520px,100%);padding:25px;max-height:90dvh;overflow:auto}.modal h2{margin:0 0 12px;font-size:19px}.qr{display:flex;justify-content:center;min-height:190px;align-items:center;margin:12px 0}.qr img,.qr canvas{border:9px solid white!important;box-shadow:0 0 0 1px var(--line)}.mobilebar{display:none}.spinner{display:inline-block;height:16px;width:16px;border-radius:50%;border:2px solid #adc8b4;border-top-color:#174d3c;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:790px){.sidebar{display:none}.main{padding:24px 16px 104px}.top{margin-bottom:20px}.grid{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:18px}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 30px #122e2110;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:12}.mobilebar button{background:none;border:0;color:var(--muted);display:grid;place-items:center;gap:2px;font-size:10px}.mobilebar button b{font-size:20px;font-weight:400}.mobilebar button.active{color:var(--green);font-weight:800}.day{min-height:48px;padding:5px 3px}.day b{font-size:11px}.idpill{font-size:10px}.metric{font-size:20px}.auth{padding:24px}.section-head{flex-wrap:wrap}}
</style></head><body>
<div id="root"><div class="auth-wrap"><div class="auth"><div class="brand"><span class="logo">A</span><div><strong>AreWarin</strong><small>STUDENT PORTAL</small></div></div><div class="spinner"></div><p>กำลังเปิดระบบ…</p></div></div></div>
<script>
'use strict';
const app={token:sessionStorage.getItem('aw_student_token')||'',data:null,view:'dashboard',month:new Date().toISOString().slice(0,7),day:'',courseFilter:'',authMode:'login',invite:null,bank:null,billId:null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thDate=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00Z');return Number.isNaN(d.getTime())?s:d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});};
const duration=m=>{m=Number(m)||0;return (Math.floor(m/60)?Math.floor(m/60)+' ชม. ':'')+(m%60?m%60+' นาที':'')||'0 นาที';};
const price=s=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB'}).format(Number(s||0)/100);const initials=s=>String(s||'A').charAt(0).toUpperCase();
function message(text,error=false){document.querySelector('.alert')?.remove();const el=document.createElement('div');el.className='alert';el.textContent=text;el.style.background=error?'#9b4444':'#174b3a';document.body.append(el);setTimeout(()=>el.remove(),4000);}
function rpc(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error('ต้องเปิดจาก URL Google Apps Script Web App ที่ Deploy แล้ว'));google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e?.message||String(e))))[name](...args);});}
async function call(name,...args){try{return await rpc(name,...args);}catch(e){message(e.message,true);throw e;}}
function loginScreen(mode){app.authMode=mode;const active=mode==='activate';const invite=app.invite||{};
 $('#root').innerHTML=`<div class="auth-wrap"><main class="auth"><div class="brand"><span class="logo">A</span><div><strong>AreWarin</strong><small>MY LEARNING / STUDENT PORTAL</small></div></div><div class="kicker">${active?'FIRST TIME ACCESS':'WELCOME BACK'}</div><h1>${active?'เปิดใช้งานบัญชี':'เข้าสู่ระบบนักเรียน'}</h1><p>${active?'กรอกรหัสนักเรียน รหัสเชิญ และตั้ง PIN 4 หลัก':'ดูตารางเรียน ชั่วโมงคงเหลือ และรายการชำระเงินได้ในที่เดียว'}</p><form class="form" id="auth-form"><label>รหัสนักเรียน<input id="login-code" required autocomplete="username" maxlength="10" placeholder="26-0001" value="${esc(invite.code||'')}"></label>${active?`<label>รหัสเชิญสำหรับเปิดใช้งานครั้งแรก<input id="activate-key" required autocomplete="off" value="${esc(invite.key||'')}"></label>`:''}<label>PIN 4 หลัก<input id="login-pin" required inputmode="numeric" pattern="[0-9]{4}" type="password" autocomplete="${active?'new-password':'current-password'}" maxlength="4" placeholder="••••"></label>${active?'<label>ยืนยัน PIN<input id="login-pin2" required inputmode="numeric" pattern="[0-9]{4}" type="password" autocomplete="new-password" maxlength="4" placeholder="••••"></label>':''}<button class="btn primary full" type="submit">${active?'ตั้ง PIN และเข้าใช้งาน':'เข้าสู่ระบบ'}</button></form><div class="buttons"><button class="btn ghost" type="button" id="toggle-auth">${active?'กลับหน้าเข้าสู่ระบบ':'เปิดใช้งานครั้งแรก'}</button></div><div class="notice" style="margin-top:18px">อย่าแชร์ PIN กับผู้อื่น หากลืม PIN ให้ผู้ดูแลออกลิงก์เปิดใช้งานใหม่</div></main></div>`;
 $('#toggle-auth').onclick=()=>loginScreen(active?'login':'activate');$('#auth-form').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const code=$('#login-code').value.trim().toUpperCase(),pin=$('#login-pin').value;const r=active?await call('activateAccount',code,$('#activate-key').value,pin,$('#login-pin2').value):await call('loginStudent',code,pin);app.token=r.token;sessionStorage.setItem('aw_student_token',r.token);app.invite=null;await refresh();}finally{btn.disabled=false;}};
}
async function refresh(){if(!app.token){loginScreen(app.invite?'activate':'login');return;}try{app.data=await rpc('getMyData',app.token);render();}catch(e){app.token='';sessionStorage.removeItem('aw_student_token');message(e.message,true);loginScreen('login');}}
async function logout(){try{if(app.token)await rpc('logoutStudent',app.token);}finally{app.token='';sessionStorage.removeItem('aw_student_token');app.data=null;loginScreen('login');}}
const menu=[['dashboard','⌂','หน้าแรก'],['schedule','▦','ตาราง'],['courses','▤','คอร์ส'],['payments','฿','ชำระเงิน'],['profile','☻','บัญชี']];
function render(){const d=app.data,s=d.student;const nav=menu.map(([id,icon,label])=>`<button type="button" class="${app.view===id?'active':''}" data-nav="${id}"><span>${icon}</span>${label}</button>`).join('');$('#root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">A</span><div><strong>AreWarin</strong><small>MY LEARNING</small></div></div><nav class="nav">${nav}<button data-nav="history"><span>◷</span>ประวัติการเรียน</button><button data-nav="requests"><span>☑</span>ลา · ชดเชย · คำขอ</button><button data-nav="progress"><span>◈</span>เนื้อหาที่เรียน</button></nav><div class="sidebarfoot">Student Portal v1.0<br>ข้อมูลนักเรียนเป็นส่วนตัว</div></aside><main class="main"><div class="top"><div><div class="kicker">AREWARIN / STUDENT PORTAL</div><h1 class="title">${esc(({dashboard:'My Learning',schedule:'ตารางเรียน',courses:'คอร์สเรียนของฉัน',payments:'ชำระค่าคาบเรียน',profile:'บัญชีนักเรียน',history:'ประวัติการเรียน',requests:'คำขอและเรียนชดเชย',progress:'การเรียนและการบ้าน'})[app.view])}</h1><p class="sub">${esc(s.name)} · ${esc([s.school,s.grade].filter(Boolean).join(' · '))}</p></div><span class="idpill">${esc(s.code)}</span></div><div id="page">${pageHtml()}</div></main><nav class="mobilebar">${menu.map(([id,icon,label])=>`<button class="${app.view===id?'active':''}" data-nav="${id}"><b>${icon}</b>${label}</button>`).join('')}</nav></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{app.view=b.dataset.nav;render();window.scrollTo(0,0);});wirePage();}
function pageHtml(){switch(app.view){case 'dashboard':return dashboard();case 'schedule':return schedulePage();case 'courses':return coursesPage();case 'history':return historyPage();case 'payments':return paymentsPage();case 'requests':return requestsPage();case 'progress':return progressPage();case 'profile':return profilePage();default:return dashboard();}}
function courseCard(c){const hour=c.mode==='hourly',paid=app.data.billing.filter(b=>b.courseId===c.id).reduce((n,b)=>n+b.paid,0),out=app.data.billing.filter(b=>b.courseId===c.id).reduce((n,b)=>n+Math.max(0,b.amount-b.paid),0);
 return `<article class="card"><div class="row"><h3 style="margin:0">${esc(c.title)} · รอบ ${c.cycle}</h3><span class="tag ${hour?'info':''}">${hour?'รายชั่วโมง':'แพ็กเกจ'}</span></div>${hour?`<div class="line"></div><div class="grid3"><div><div class="small">ราคา/ชม.</div><div class="metric">฿${Number(c.rate).toLocaleString('th-TH')}</div></div><div><div class="small">เรียนแล้ว</div><div class="metric">${duration(c.used)}</div></div><div><div class="small">ค้างชำระ</div><div class="metric">${price(out)}</div></div></div>`:`<div class="line"></div><div class="grid3"><div><div class="small">ซื้อทั้งหมด</div><div class="metric">${duration(c.purchased)}</div></div><div><div class="small">เรียนแล้ว</div><div class="metric">${duration(c.used)}</div></div><div><div class="small">คงเหลือ</div><div class="metric" style="color:var(--green)">${duration(c.balance)}</div></div></div><div class="progress" style="margin-top:15px"><span style="width:${Math.min(100,Math.max(0,c.purchased?100*c.used/c.purchased:0))}%"></span></div>`}<div class="buttons"><button class="btn" data-request="renew" data-course="${esc(c.id)}">ขอต่อคอร์ส</button><button class="btn ghost" data-navto="history" data-course="${esc(c.id)}">ดูประวัติ</button>${hour&&out>0?'<button class="btn primary" data-navto="payments">ดูยอดชำระ</button>':''}</div></article>`;}
function dashboard(){const d=app.data,active=d.courses.filter(c=>c.status==='active'),balance=active.filter(c=>c.mode!=='hourly').reduce((n,c)=>n+c.balance,0),out=d.billing.reduce((n,b)=>n+Math.max(0,b.amount-b.paid),0),next=d.schedule.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 return `<section class="card summary"><div class="kicker">LEARNING OVERVIEW</div><h2 style="margin:5px 0 18px">สวัสดี, ${esc(d.student.name)}</h2><div class="grid3"><div><div class="small">คอร์สที่เรียน</div><div class="metric">${active.length}</div></div><div><div class="small">ชั่วโมงคงเหลือ</div><div class="metric">${duration(balance)}</div></div><div><div class="small">คาบที่บันทึก</div><div class="metric">${d.attendance.length}</div></div></div></section><div class="section-head"><h2>คอร์สปัจจุบัน</h2><button class="btn ghost" data-navto="courses">ดูทั้งหมด</button></div><div class="grid">${active.slice(0,2).map(courseCard).join('')||'<div class="card empty">ยังไม่มีคอร์สที่ใช้งาน</div>'}</div><div class="section-head"><h2>การชำระเงินและคำขอ</h2></div><div class="grid"><div class="card"><div class="small">ยอดค่าคาบค้างชำระ</div><div class="metric">${price(out)}</div><div class="buttons"><button class="btn primary" data-navto="payments">ชำระเงิน / ส่งสลิป</button></div></div><div class="card"><div class="small">คำขอรออนุมัติ</div><div class="metric">${d.requests.filter(r=>r.status==='pending').length}</div><div class="buttons"><button class="btn ghost" data-navto="requests">ติดตามสถานะ</button></div></div></div><div class="section-head"><h2>คาบเรียนล่าสุด</h2><button class="btn ghost" data-navto="history">ดูประวัติ</button></div><div class="card">${attendanceList(d.attendance.slice(0,4))}</div><div class="section-head"><h2>จัดการการเรียน</h2></div><div class="buttons"><button class="btn" data-navto="schedule">▦ ปฏิทินเรียน</button><button class="btn" data-navto="requests">☷ แจ้งลา / ขอชดเชย</button><button class="btn" data-navto="progress">◈ การบ้านและเนื้อหา</button></div>`;}
function attendanceList(items){return items.map(a=>`<div class="list-row"><div><strong>${esc(thDate(a.date))}</strong><div class="small">${esc(a.course)} · ${esc(a.start)}–${esc(a.end)}</div></div><div style="text-align:right"><strong>${duration(a.minutes)}</strong><br><button class="btn ghost" style="font-size:11px;padding:5px;min-height:27px" data-review="${esc(a.id)}">ขอตรวจสอบ</button></div></div>`).join('')||'<div class="empty">ยังไม่มีประวัติการเรียนที่บันทึกแล้ว</div>';}
function coursesPage(){return `<div class="grid">${app.data.courses.filter(c=>c.status==='active').map(courseCard).join('')||'<div class="card empty">ไม่มีคอร์สปัจจุบัน</div>'}</div><div class="section-head"><h2>คอร์สเก่า</h2></div><div class="grid">${app.data.courses.filter(c=>c.status!=='active').map(courseCard).join('')||'<div class="card empty">ยังไม่มีคอร์สที่ปิดรอบแล้ว</div>'}</div><div class="buttons"><button class="btn primary" data-request="new_course">+ ขอเรียนคอร์สใหม่</button></div>`;}
function historyPage(){const cs=app.data.courses,filtered=app.courseFilter?app.data.attendance.filter(x=>x.courseId===app.courseFilter):app.data.attendance;return `<section class="card"><div class="row"><h3>Learning History</h3><select id="course-filter" class="btn ghost"><option value="">ทุกคอร์ส</option>${cs.map(c=>`<option value="${esc(c.id)}" ${app.courseFilter===c.id?'selected':''}>${esc(c.title)} · รอบ ${c.cycle}</option>`).join('')}</select></div><div class="row"><div class="small">คาบที่เรียนแล้ว ${filtered.length} คาบ</div><strong>ตัดทั้งหมด ${duration(filtered.reduce((n,a)=>n+a.minutes,0))}</strong></div><div class="line"></div>${attendanceList(filtered)}</section>`;}
function scheduleEntries(month){const first=new Date(month+'-01T12:00:00Z');const days=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();const entries=[];for(let i=1;i<=days;i++){let date=month+'-'+String(i).padStart(2,'0');for(const sc of app.data.schedule){if(sc.repeat==='weekly'){if(date>=sc.date&&new Date(date+'T12:00:00Z').getUTCDay()===new Date(sc.date+'T12:00:00Z').getUTCDay())entries.push({...sc,date});}else if(sc.date===date)entries.push({...sc,date});}}return entries;}
function schedulePage(){const m=app.month,first=new Date(m+'-01T12:00:00Z'),start=first.getUTCDay(),days=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate(),items=scheduleEntries(m),selected=app.day||m+'-01';let cells='';for(let i=0;i<start;i++)cells+='<div class="day other"></div>';for(let n=1;n<=days;n++){const date=m+'-'+String(n).padStart(2,'0'),on=items.filter(x=>x.date===date);cells+=`<button type="button" class="day ${selected===date?'sel':''}" data-date="${date}"><b>${n}</b><div>${on.slice(0,4).map(x=>`<span class="dot ${x.kind==='group'?'group':''}"></span>`).join('')}</div></button>`;}
 return `<div class="card"><div class="row"><button class="btn ghost" id="prev-month">‹</button><h3 style="margin:0">${first.toLocaleDateString('th-TH',{month:'long',year:'numeric',timeZone:'UTC'})}</h3><button class="btn ghost" id="next-month">›</button></div><div class="monthgrid" style="margin:17px 0 5px">${['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="small" style="text-align:center">${x}</div>`).join('')}</div><div class="monthgrid">${cells}</div><div class="small" style="margin-top:13px"><span class="dot"></span> เรียนเดี่ยว &nbsp; <span class="dot group"></span> เรียนกลุ่ม</div></div><div class="section-head"><h2>คาบวันที่ ${thDate(selected)}</h2></div><div class="card">${items.filter(x=>x.date===selected).map(x=>`<div class="list-row"><div><strong>${x.kind==='group'?'เรียนกลุ่ม':'เรียนเดี่ยว'}</strong><div class="small">${esc(x.start)}–${esc(x.end)} · ${esc(x.tutor||'')}</div></div><span class="tag ${x.kind==='group'?'info':''}">นัดเรียน</span></div>`).join('')||'<div class="empty">ไม่มีตารางเรียนในวันที่เลือก</div>'}</div><div class="notice" style="margin-top:15px">ตารางนี้เป็นนัดหมาย ไม่ใช่หลักฐานว่ามีการเรียนแล้ว ชั่วโมงจะเปลี่ยนเมื่อผู้ดูแลบันทึกเวลาเรียนจริง</div>`;}
function paymentsPage(){const bills=app.data.billing.filter(b=>b.amount-b.paid>0),total=bills.reduce((n,b)=>n+b.amount-b.paid,0);return `<section class="card summary"><div class="small">ยอดค้างชำระ</div><div class="metric">${price(total)}</div><p class="small">สแกน QR พร้อมเพย์ แล้วส่งสลิปให้ผู้ดูแลตรวจสอบเงินเข้าบัญชีจริง</p></section><div class="section-head"><h2>ค่าคาบที่ต้องชำระ</h2></div><div class="stack">${bills.map(b=>`<div class="card"><div class="row"><div><h3>${esc(b.course)}</h3><div class="small">${thDate(b.date)} · ${duration(b.minutes)}</div></div><span class="tag warn">รอชำระ</span></div><div class="row"><span>ยอดค้างชำระ</span><strong style="font-size:19px">${price(b.amount-b.paid)}</strong></div><div class="buttons"><button class="btn primary" data-pay="${esc(b.id)}">แสดง QR / อัปโหลดสลิป</button></div></div>`).join('')||'<div class="card empty">ไม่มีค่าคาบค้างชำระ</div>'}</div><div class="section-head"><h2>รายการที่แจ้งชำระ</h2></div><div class="card">${app.data.requests.filter(r=>r.kind==='payment').map(r=>`<div class="list-row"><div><strong>${price(r.amount)}</strong><div class="small">${esc(r.createdAt)}</div></div>${statusTag(r.status)}</div>`).join('')||'<div class="empty">ยังไม่มีรายการแจ้งชำระ</div>'}</div>`;}
function statusTag(s){return `<span class="tag ${s==='pending'?'warn':s==='rejected'?'bad':''}">${({pending:'รอตรวจสอบ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ'})[s]||esc(s)}</span>`;}
function requestsPage(){return `<div class="grid"><div class="card"><h3>แจ้งลา / พักเรียน / ขอชดเชย</h3><p class="small">เลือกคอร์สและวันที่ โดยผู้ดูแลจะตรวจสอบก่อนยืนยันตารางเรียน</p><div class="buttons"><button class="btn primary" data-request="leave">แจ้งลา</button><button class="btn" data-request="pause">พักการเรียน</button><button class="btn ghost" data-request="makeup">ขอเรียนชดเชย</button></div></div><div class="card"><h3>จัดการคอร์ส</h3><p class="small">ส่งคำขอคอร์สเพิ่มเติมและติดตามสถานะการอนุมัติ</p><div class="buttons"><button class="btn" data-request="renew">ขอต่อคอร์ส</button><button class="btn" data-request="new_course">ลงคอร์สเพิ่ม</button></div></div></div><div class="section-head"><h2>ติดตามคำขอทั้งหมด</h2></div><div class="card">${app.data.requests.map(r=>`<div class="list-row"><div><strong>${esc(({payment:'แจ้งชำระ',renew:'ต่อคอร์ส',new_course:'ลงคอร์สใหม่',leave:'แจ้งลา',pause:'พักการเรียน',makeup:'เรียนชดเชย',attendance_review:'ตรวจชั่วโมง',class_confirm:'ยืนยันนัด'})[r.kind]||r.kind)}</strong><div class="small">${esc(r.createdAt)} ${r.adminNote?('· '+esc(r.adminNote)):''}</div></div>${statusTag(r.status)}</div>`).join('')||'<div class="empty">ยังไม่มีคำขอ</div>'}</div><div class="section-head"><h2>สิทธิ์และคาบชดเชย</h2></div><div class="card">${app.data.makeup.map(m=>`<div class="list-row"><div><strong>คาบเดิม ${thDate(m.originDate)}</strong><div class="small">${m.scheduledDate?`นัดใหม่ ${thDate(m.scheduledDate)} ${esc(m.start)}–${esc(m.end)}`:'ยังไม่ได้กำหนดวันใหม่'}</div></div><span class="tag">${esc(m.status)}</span></div>`).join('')||'<div class="empty">ยังไม่มีสิทธิ์ชดเชย</div>'}</div>`;}
function progressPage(){const notes=app.data.lessonNotes;return `<div class="card"><h3>Lesson Journal & Homework</h3><p class="small">ข้อมูลจากสมุดบันทึกการสอนที่ผู้ดูแลบันทึกในระบบ</p>${notes.map(n=>`<div class="list-row"><div><strong>${esc(n.title||'บทเรียน')}</strong><div class="small">${esc(n.homework||'ไม่มีการบ้าน')} · ${esc(n.createdAt.slice(0,10))}</div></div></div>`).join('')||'<div class="empty">ยังไม่มีบันทึกบทเรียน</div>'}</div>`;}
function profilePage(){const s=app.data.student;return `<div class="card stack"><div class="row"><div><h3>ข้อมูลนักเรียน</h3><div class="small">Student ID</div><strong>${esc(s.code)}</strong></div><span class="tag">${esc(s.status)}</span></div><div class="line"></div><div><div class="small">ชื่อ</div><strong>${esc(s.fullName||s.name)}</strong></div><div><div class="small">โรงเรียน / ระดับชั้น</div><strong>${esc([s.school,s.grade].filter(Boolean).join(' · ')||'—')}</strong></div><div class="line"></div><p class="small">หากลืม PIN หรือข้อมูลไม่ถูกต้อง กรุณาติดต่อผู้ดูแลเพื่อออกลิงก์เปิดใช้งานใหม่</p><button class="btn danger" id="logout">ออกจากระบบ</button></div>`;}
function modal(html){const root=document.createElement('div');root.id='pop';root.className='modalback';root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="row"><div></div><button class="btn ghost" id="popclose">× ปิด</button></div>${html}</div>`;document.body.append(root);$('#popclose').onclick=()=>root.remove();root.onclick=e=>{if(e.target===root)root.remove();};}
function requestForm(kind,preCourse='',preAttendance=''){const d=app.data,withCourse=kind!=='new_course',label=({renew:'ขอต่อคอร์ส',new_course:'ขอลงคอร์สใหม่',leave:'แจ้งลา',pause:'ขอพักการเรียน',makeup:'ขอเรียนชดเชย',attendance_review:'ขอตรวจชั่วโมง',class_confirm:'ยืนยันนัด'})[kind];modal(`<h2>${label}</h2><p class="small">ส่งคำขอให้ผู้ดูแลตรวจสอบ ไม่เปลี่ยนข้อมูลคอร์สหรือชั่วโมงโดยอัตโนมัติ</p><form id="request-form" class="form">${withCourse?`<label>คอร์ส<select name="courseId" required><option value="">เลือกคอร์ส</option>${d.courses.filter(c=>c.status==='active').map(c=>`<option value="${esc(c.id)}" ${c.id===preCourse?'selected':''}>${esc(c.title)} · รอบ ${c.cycle}</option>`).join('')}</select></label>`:''}${kind==='leave'||kind==='pause'?`<label>วันที่เริ่ม<input type="date" name="date" required></label>`:''}${kind==='makeup'||kind==='pause'||kind==='leave'?`<label>${kind==='pause'?'วันที่คาดว่าจะกลับมา':'วันที่ชดเชยที่ต้องการ (ถ้ามี)'}<input type="date" name="targetDate"></label>`:''}${kind==='attendance_review'?`<input type="hidden" name="attendanceId" value="${esc(preAttendance)}">`:''}${kind==='new_course'?'<label>ชื่อคอร์สที่สนใจ<input name="note" placeholder="เช่น A-Level Biology" required maxlength="200"></label>':'<label>รายละเอียด / หมายเหตุ<textarea name="note" maxlength="800" placeholder="ระบุรายละเอียดเพิ่มเติม"></textarea></label>'}<button class="btn primary full">ส่งคำขอ</button></form>`);
 $('#request-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const obj=Object.fromEntries(new FormData(e.target));await call('submitPortalRequest',app.token,{kind,...obj});$('#pop').remove();message('ส่งคำขอสำเร็จ · รอผู้ดูแลตรวจสอบ');await refresh();}finally{b.disabled=false;}};
}
function tlv(tag,str){return tag+String(str.length).padStart(2,'0')+str;}
function promptPayPayload(id,satang){const digits=String(id).replace(/\D/g,'');let pp;if(digits.length===13)pp=tlv('02',digits);else if(digits.length===10&&digits.startsWith('0'))pp=tlv('01','0066'+digits.slice(1));else throw Error('รหัสพร้อมเพย์ไม่ถูกต้อง');const account=tlv('00','A000000677010111')+pp,amount=(Number(satang)/100).toFixed(2);let raw=tlv('00','01')+tlv('01','12')+tlv('29',account)+tlv('53','764')+tlv('54',amount)+tlv('58','TH')+'6304';let crc=65535;for(let i=0;i<raw.length;i++){crc^=raw.charCodeAt(i)<<8;for(let n=0;n<8;n++)crc=(crc&32768)?((crc<<1)^4129)&65535:(crc<<1)&65535;}return raw+crc.toString(16).toUpperCase().padStart(4,'0');}
function paymentForm(billId){const b=app.data.billing.find(x=>x.id===billId),bank=app.data.bank;if(!b)return;const remaining=b.amount-b.paid;if(remaining<=0)return message('ไม่มียอดค้าง');modal(`<h2>ชำระค่าคาบ</h2><div class="notice">${esc(b.course)} · ${thDate(b.date)}</div><div style="text-align:center;margin:15px 0"><div class="small">ยอดค้างชำระ</div><div class="metric">${price(remaining)}</div></div><form id="pay-form" class="form"><label>ยอดที่แจ้งชำระ (บาท)<input id="pay-amount" name="amountBaht" type="number" required min="0.01" max="${(remaining/100).toFixed(2)}" step="0.01" value="${(remaining/100).toFixed(2)}"></label><div id="qrcode" class="qr"></div><div class="small" style="text-align:center">พร้อมเพย์ ${esc(bank.promptpayId)}<br>${esc(bank.recipientName)}<br>หรือโอนธนาคาร${esc(bank.bank)} ${esc(bank.bankAccount)}</div><label>แนบสลิปการโอน (PNG, JPG, PDF · ไม่เกิน 4 MB)<input id="slip" type="file" accept="image/jpeg,image/png,application/pdf" required></label><label>หมายเหตุ (ถ้ามี)<textarea name="note" maxlength="500"></textarea></label><button class="btn primary full">ส่งสลิปให้ตรวจสอบ</button></form><div class="notice warning" style="margin-top:12px">ระบบยังไม่ถือว่าชำระแล้ว จนกว่าผู้ดูแลตรวจสอบเงินเข้าบัญชีจริงและอนุมัติ</div>`);
 function qr(){const amount=Math.round(Number($('#pay-amount').value||0)*100),el=$('#qrcode');el.innerHTML='';if(!amount||amount>remaining){el.textContent='ตรวจสอบยอดเงิน';return;}try{const payload=promptPayPayload(bank.promptpayId,amount);if(window.QRCode)new QRCode(el,{text:payload,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});else el.innerHTML='<div class="notice warning">ไม่สามารถโหลดภาพ QR ได้ โปรดโอนด้วยเลขบัญชีด้านล่างและตรวจชื่อผู้รับ</div>';}catch(e){el.textContent=e.message;}}
 $('#pay-amount').oninput=qr;qr();$('#pay-form').onsubmit=async e=>{e.preventDefault();const input=$('#slip'),file=input.files?.[0],amount=Number($('#pay-amount').value);if(!file||file.size>4*1024*1024||!['image/png','image/jpeg','application/pdf'].includes(file.type))return message('เลือกสลิป PNG/JPG/PDF ไม่เกิน 4 MB',true);const button=e.target.querySelector('button');button.disabled=true;try{const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('อ่านสลิปไม่ได้'));r.readAsDataURL(file);});await call('submitPaymentSlip',app.token,{billingId:billId,amountBaht:amount,mime:file.type,base64,note:e.target.elements.note.value});$('#pop').remove();message('ส่งสลิปเรียบร้อย · รอตรวจสอบ');await refresh();}finally{button.disabled=false;}};
}
function wirePage(){document.querySelectorAll('[data-navto]').forEach(b=>b.onclick=()=>{app.view=b.dataset.navto;if(app.view==='history')app.courseFilter=b.dataset.course||'';render();});document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>requestForm(b.dataset.request,b.dataset.course||''));document.querySelectorAll('[data-review]').forEach(b=>{b.onclick=()=>{const att=app.data.attendance.find(a=>a.id===b.dataset.review);requestForm('attendance_review',att?.courseId||'',b.dataset.review);};});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>paymentForm(b.dataset.pay));$('#logout')?.addEventListener('click',logout);$('#course-filter')?.addEventListener('change',e=>{app.courseFilter=e.target.value;render();});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{app.day=b.dataset.date;render();});const month=s=>{const d=new Date(app.month+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+s);app.month=d.toISOString().slice(0,7);app.day=app.month+'-01';render();};$('#prev-month')?.addEventListener('click',()=>month(-1));$('#next-month')?.addEventListener('click',()=>month(1));}
(function init(){try{const h=new URLSearchParams(location.hash.slice(1));const q=new URLSearchParams(location.search);const code=h.get('code')||q.get('code'),invite=h.get('invite')||q.get('invite');if(code&&invite){app.invite={code,key:invite};history.replaceState(null,'',location.pathname);} }catch{}if(app.token)refresh();else loginScreen(app.invite?'activate':'login');})();
</script></body></html>
